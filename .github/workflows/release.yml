name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - name: Verify release source and tests
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          $crlfMigrations = Get-ChildItem src-tauri/migrations -Filter *.sql | Where-Object {
            [System.IO.File]::ReadAllText($_.FullName).Contains("`r`n")
          }
          if ($crlfMigrations) {
            throw "SQL migrations must use LF line endings: $($crlfMigrations.Name -join ', ')"
          }
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: GoShootFilm v__VERSION__
          releaseBody: See the release notes for changes in this version.
          releaseDraft: true
          prerelease: false
