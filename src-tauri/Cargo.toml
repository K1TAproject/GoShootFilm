[package]
name = "goshootfilm"
version = "0.3.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "goshootfilm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls", "macros"] }
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tauri-plugin-dialog = "2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "tiff", "webp", "bmp", "gif"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
fs2 = "0.4"
serde_json = "1"
sha2 = "0.10"
axum = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
if-addrs = "0.13"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
